name: Deploy GitHub Pages redirect

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Build redirect page
        run: |
          mkdir -p dist

          cat > dist/index.html <<'EOF'
          <!doctype html>
          <html lang="ru">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <meta http-equiv="refresh" content="0; url=https://chainsaw-org.vercel.app/tree" />
              <link rel="canonical" href="https://chainsaw-org.vercel.app/tree" />
              <title>Redirecting...</title>
            </head>
            <body>
              <script>
                window.location.replace('https://chainsaw-org.vercel.app/tree');
              </script>

              <p>
                Redirecting to
                <a href="https://chainsaw-org.vercel.app/tree">new site</a>
              </p>
            </body>
          </html>
          EOF

          cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4